name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Lurcast version
      description: Output of `lurcast --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Encoder or player, its settings, and the relevant part of your config (remove passwords).
  - type: textarea
    id: logs
    attributes:
      label: Server log
      render: text
