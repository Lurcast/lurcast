name: Release

# Push a tag like v0.1.0. Builds Lurcast for x86-64 and ARM64 Linux as tarballs (the binary with its
# shared libraries and musl's loader, which run on any Linux), publishes them on a GitHub release with
# the source of the LGPL library they include (LAME), and pushes a multi-arch image built from them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The build runs in the Alpine image with `docker run`, not as a job container,
      # because GitHub's JavaScript actions cannot run in Alpine containers on ARM64 runners.
      - name: Build the bundle
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LURCAST_SOURCES=/src/sources crystallang/crystal:1.21.1-alpine sh -euc '
            apk add --no-cache libogg-dev opus-dev xz
            # LAME, as a shared library from its pinned release tarball.
            sh ext/build-lame.sh
            shards install --production
            shards build lurcast --production --release --no-debug --link-flags=-static-libgcc
            sh deploy/bundle.sh bin/lurcast dist/lurcast
            chown -R "$(stat -c %u:%g /src)" bin lib dist sources
          '
          # The runner is Ubuntu (glibc): this checks the bundle runs outside Alpine.
          ./dist/lurcast/lurcast --version
          cd dist
          tar czf lurcast-linux-${{ matrix.arch }}.tar.gz lurcast
          sha256sum lurcast-linux-${{ matrix.arch }}.tar.gz > lurcast-linux-${{ matrix.arch }}.tar.gz.sha256
          rm -rf lurcast
          mv ../sources/* .
      - uses: actions/upload-artifact@v7
        with:
          name: lurcast-linux-${{ matrix.arch }}
          path: dist/

  publish:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            THIRD_PARTY_NOTICES.txt
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lurcast/lurcast
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
