name: Release

# Push a tag like v0.1.0. Builds static Linux binaries for x86-64 and ARM64, publishes them on a
# GitHub release, and pushes a multi-arch image to ghcr.io/lurcast/lurcast built from those binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: crystallang/crystal:1.21.1-alpine
    steps:
      - uses: actions/checkout@v5
      - run: apk add --no-cache libogg-dev libogg-static
      - run: shards install --production
      - name: Build static binary
        run: |
          shards build lurcast --production --release --static --no-debug
          mkdir -p dist
          cp bin/lurcast dist/lurcast-linux-${{ matrix.arch }}
          ./dist/lurcast-linux-${{ matrix.arch }} --version
          cd dist && sha256sum lurcast-linux-${{ matrix.arch }} > lurcast-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lurcast-linux-${{ matrix.arch }}
          path: dist/

  publish:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
