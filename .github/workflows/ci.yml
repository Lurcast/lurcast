name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.1
      - name: Install audio libraries (FDK for the AAC specs), and ffmpeg for the specs
        run: sudo apt-get update && sudo apt-get install -y libogg-dev libopus-dev libmp3lame-dev libfdk-aac2 ffmpeg
      - run: shards install
      - name: Format
        run: crystal tool format --check src spec bench
      - name: Lint
        run: mkdir -p bin && crystal build lib/ameba/src/cli.cr -o bin/ameba && bin/ameba
      - name: Specs
        run: crystal spec
      - name: Release builds
        run: shards build lurcast --release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t lurcast:ci .
      - name: Smoke test
        run: |
          docker run -d --name lurcast -p 8000:8000 \
            -e LURCAST_SOURCE_PASSWORD=ci-source -e LURCAST_ADMIN_PASSWORD=ci-admin -e LURCAST_RELAY_PASSWORD=ci-relay \
            lurcast:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/status-json.xsl && exit 0
            sleep 1
          done
          docker logs lurcast
          exit 1
